<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Forever ❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:system-ui,sans-serif;
background:linear-gradient(135deg,#120018,#2d0b45,#0b1b3d);
color:#fff;overflow-x:hidden}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#090011;z-index:10}
.glass{background:rgba(255,255,255,.12);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:24px;max-width:420px;width:90%;text-align:center}
input,button{padding:12px 16px;border-radius:10px;border:none;margin-top:10px}
button{background:#ff4f87;color:#fff;cursor:pointer}
main{display:none;padding:20px;max-width:900px;margin:auto}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
#count{font-size:2rem;margin:18px}
.card{margin:20px 0}
.reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.reason{padding:10px;border-radius:12px;background:rgba(255,255,255,.08)}
.float{position:fixed;top:-20px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<div class="screen" id="lock">
<div class="glass">
<h2>🔒 Enter Password</h2>
<input id="pw" type="password" placeholder="0708">
<br><button onclick="go()">Open</button>
<p id="err"></p>
</div>
</div>

<main id="app">
<section class="hero">
<h1>❤️ Our Forever ❤️</h1>
<div class="glass card">
<h2>Countdown to 7 August</h2>
<div id="count"></div>
<button onclick="window.open('https://youtu.be/Y2E71oe0aSM')">▶ Play Our Song</button>
</div>
<div class="glass card">
<h2>Love Letter</h2>
<p id="letter"></p>
</div>
<div class="glass card">
<h2>Our Story</h2>
<p>✨ We met • ❤️ We fell in love • 💍 Forever begins.</p>
</div>
<div class="glass card">
<h2>100 Reasons I Love You</h2>
<div id="reasons" class="reasons"></div>
</div>
</section>
</main>

<script>
function go(){
if(pw.value==="0708"){lock.style.display="none";app.style.display="block";effects();}
else err.textContent="Wrong password";}
const t="My love, thank you for making every day beautiful. I will always choose you. ❤️";
let i=0;(()=>{if(i<t.length){letter.textContent+=t[i++];setTimeout(arguments.callee,35)}})();
for(let n=1;n<=100;n++){let d=document.createElement("div");d.className="reason";d.textContent=n+". Because you are amazing.";reasons.appendChild(d);}
function cd(){
let now=new Date(),y=now.getFullYear(),target=new Date(y,7,7);
if(now>target)target=new Date(y+1,7,7);
let ms=target-now;
count.textContent=Math.floor(ms/86400000)+"d "+Math.floor(ms%86400000/3600000)+"h "+Math.floor(ms%3600000/60000)+"m "+Math.floor(ms%60000/1000)+"s";
}
setInterval(cd,1000);cd();
function effects(){
setInterval(()=>{
let e=document.createElement("div");
e.className="float";
e.textContent=["❤️","🌹","✨"][Math.floor(Math.random()*3)];
e.style.left=Math.random()*100+"vw";
e.style.fontSize=(16+Math.random()*18)+"px";
e.style.animationDuration=(4+Math.random()*4)+"s";
document.body.appendChild(e);
setTimeout(()=>e.remove(),8000);
},250);
}
</script>
</body>
</html>
