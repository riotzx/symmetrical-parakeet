<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<style>
body{
margin:0;
padding:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#ff4e8a,#6a11cb);
font-family:Arial,sans-serif;
color:white;
text-align:center;
overflow:hidden;
}

.container{
padding:30px;
background:rgba(255,255,255,0.1);
border-radius:20px;
backdrop-filter:blur(10px);
box-shadow:0 0 20px rgba(255,255,255,.3);
}

button{
padding:15px 30px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
background:white;
color:#ff2d75;
font-weight:bold;
}

#content{
display:none;
margin-top:20px;
}

#countdown{
font-size:30px;
margin:20px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>❤️ For My Momo ❤️</h1>

<button onclick="login()">Open Love Letter</button>

<div id="content">

<h2>Happy Anniversary ❤️</h2>

<div id="countdown"></div>

<p>
Every moment with you is the best part of my life.
I love you forever. ❤️
</p>

<audio controls>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

</div>

</div>

<script>

function login(){
let pass=prompt("Enter Password");
if(pass==="0708"){
document.getElementById("content").style.display="block";
}else{
alert("Wrong Password ❤️");
}
}

var countDownDate=new Date("August 7, 2026 00:00:00").getTime();

setInterval(function(){

var now=new Date().getTime();

var distance=countDownDate-now;

var days=Math.floor(distance/(1000*60*60*24));
var hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));
var minutes=Math.floor((distance%(1000*60*60))/(1000*60));
var seconds=Math.floor((distance%(1000*60))/1000);

document.getElementById("countdown").innerHTML=
days+"d "+hours+"h "+minutes+"m "+seconds+"s";

},1000);

</script>

</body>
</html>
