<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<style>
body{
margin:0;
padding:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#ff4e8a,#6a11cb);
font-family:Arial,sans-serif;
color:white;
text-align:center;
overflow:hidden;
}

.container{
padding:30px;
background:rgba(255,255,255,0.1);
border-radius:20px;
backdrop-filter:blur(10px);
box-shadow:0 0 20px rgba(255,255,255,.3);
}

button{
padding:15px 30px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
background:white;
color:#ff2d75;
font-weight:bold;
}

#content{
display:none;
margin-top:20px;
}

#countdown{
font-size:30px;
margin:20px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>❤️ For My Momo ❤️</h1>

<button id="openBtn" type="button">Open Love Letter</button>

<div id="content">

<h2>Happy Anniversary ❤️</h2>

<div id="countdown"></div>

<p>
Every moment with you is the best part of my life.
Like the song says, I'd spend 10,000 hours and 10,000 more just to learn how you love me — you are my everything.
I love you forever. ❤️
</p>

<p><em>Track: 10,000 Hours — Justin Bieber &amp; Dan + Shay</em></p>

<audio id="audio" controls>
  <source src="https://archive.org/download/cloud0218popsongs2019/01bbcc2019.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

</div>

</div>

<script>
const openBtn = document.getElementById('openBtn');

openBtn.addEventListener('click', login);

function login(){
  const pass = prompt("Enter Password");
  // If user clicked Cancel, pass === null — do nothing
  if (pass && pass.trim() === "0708") {
    document.getElementById("content").style.display = "block";

    // Try to start playing the audio. Modern browsers may still block autoplay;
    // if blocked, the catch will run and we can optionally show a message.
    const audio = document.getElementById('audio');
    const playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        // playing
      }).catch((err) => {
        // Autoplay blocked — user can press the play button shown by the controls
        console.warn('Autoplay prevented:', err);
        // Optionally notify the user in a friendlier way:
        setTimeout(() => {
          alert('Music playback was blocked by the browser. Please press the play button on the audio control to start the song.');
        }, 200);
      });
    }
  } else if (pass !== null) {
    // Only alert when user actually entered something wrong (not when they cancelled)
    alert("Wrong Password ❤️");
  }
}

var countDownDate=new Date("August 7, 2026 00:00:00").getTime();

setInterval(function(){

  var now=new Date().getTime();

  var distance=countDownDate-now;

  var days=Math.floor(distance/(1000*60*60*24));
  var hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));
  var minutes=Math.floor((distance%(1000*60*60))/(1000*60));
  var seconds=Math.floor((distance%(1000*60))/1000);

  document.getElementById("countdown").innerHTML=
  days+"d "+hours+"h "+minutes+"m "+seconds+"s";

},1000);

</script>

</body>
</html>
