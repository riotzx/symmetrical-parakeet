<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mumu ❤️ Momo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:radial-gradient(circle at top,#4b0a64,#170022 70%);color:#fff;overflow-x:hidden}
#lock,#main{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.card{width:min(92%,760px);background:rgba(255,255,255,.12);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:24px;margin:18px;text-align:center;box-shadow:0 0 30px rgba(255,100,180,.2)}
input{padding:14px;border-radius:12px;border:none;width:220px}
button{padding:14px 28px;border:none;border-radius:999px;background:#ff4d88;color:#fff;font-size:18px;cursor:pointer}
h1{font-size:clamp(2.2rem,6vw,4rem)}#count{font-size:2rem;font-weight:700}
#letter{white-space:pre-wrap;line-height:1.7;text-align:left;min-height:220px}
.heart{position:fixed;bottom:-30px;font-size:24px;animation:f 8s linear forwards}
@keyframes f{to{transform:translateY(-120vh) rotate(360deg);opacity:0}}
.reason{padding:10px;margin:8px;border-radius:12px;background:rgba(255,255,255,.08)}
canvas{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="lock">
<div class="card">
<h1>🔒 Our Forever</h1>
<p>Password</p>
<input id="p" type="password" placeholder="0708"><br><br>
<button onclick="go()">Open ❤️</button>
<p id="m"></p>
</div>
</div>

<div id="main" style="display:none">
<h1>❤️ Mumu & Momo ❤️</h1>
<div class="card">
<h2>Countdown to 7 August</h2>
<div id="count"></div><br>
<button onclick="window.open('https://www.youtube.com/results?search_query=10000+Hours+Dan+Shay+Justin+Bieber')">🎵 Play Our Song</button>
</div>

<div class="card">
<h2>💌 Love Letter</h2>
<div id="letter"></div>
</div>

<div class="card">
<h2>🌹 100 Reasons I Love You</h2>
<div id="reasons"></div>
</div>

<div class="card">
<h2>✨ Forever & Always ✨</h2>
<p>Happy Anniversary – 7 August ❤️</p>
</div>
</div>

<script>
function go(){if(p.value==='0708'){lock.style.display='none';main.style.display='flex';fire()}else m.innerText='Wrong password';}
function tick(){
let n=new Date(),y=n.getFullYear(),t=new Date(y,7,7);
if(n>t)t=new Date(y+1,7,7);
let d=t-n;
count.innerHTML=`${Math.floor(d/86400000)} Days ${Math.floor(d%86400000/36e5)}h ${Math.floor(d%36e5/6e4)}m ${Math.floor(d%6e4/1000)}s`;
}
setInterval(tick,1000);tick();

const txt=`My Dearest Momo,

You are my safest place, my favourite smile and my biggest blessing.

Every heartbeat whispers your name.
Every dream has you in it.

Happy Anniversary ❤️

Forever yours,
Mumu`;
let i=0;(function type(){if(i<txt.length){letter.textContent+=txt[i++];setTimeout(type,35)}})();

for(let i=1;i<=100;i++){let d=document.createElement('div');d.className='reason';d.textContent=i+'. Because you make every day brighter.';reasons.appendChild(d);}
setInterval(()=>{let e=document.createElement('div');e.className='heart';e.style.left=Math.random()*100+'vw';e.style.animationDuration=(5+Math.random()*5)+'s';e.textContent=Math.random()>.5?'❤️':'🌹';document.body.appendChild(e);setTimeout(()=>e.remove(),9000)},250);

const c=document.getElementById('fx'),x=c.getContext('2d');function rs(){c.width=innerWidth;c.height=innerHeight}rs();onresize=rs;
let pts=[];
function fire(){for(let i=0;i<180;i++)pts.push({x:c.width/2,y:c.height/2,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,l:80+Math.random()*30});}
(function anim(){x.clearRect(0,0,c.width,c.height);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.l--;x.fillStyle='hsl('+Math.random()*360+',100%,70%)';x.fillRect(p.x,p.y,3,3)});pts=pts.filter(p=>p.l>0);requestAnimationFrame(anim)})();
</script>
</body></html>
